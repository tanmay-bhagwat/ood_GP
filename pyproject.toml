[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ood-gp"
version = "0.1.0"
description = "Gaussian-process OOD detection for atomistic representations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ase",
    "dscribe",
    "numpy",
    "PyYAML",
    "torch",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: test requires an accelerator",
]
